name: Nextcloud
services:
  Nextcloud:
    container_name: Nextcloud
    image: nextcloud
    restart: unless-stopped
    networks:
      - Nextcloud
      - Redis
      - MariaDB
    environment:
      - MYSQL_DATABASE=DB
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_HOST=DB
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_HOST=Redis
      - NEXTCLOUD_TRUSTED_DOMAINS=${HOST}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEHOST=${HOST}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${HOST}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=nextcloud
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - PHP_MEMORY_LIMIT=4096M
      - PHP_UPLOAD_LIMIT=32G
      - APACHE_DISABLE_REWRITE_IP=1
      - APACHE_BODY_LIMIT=0
      - FILEDROP_EMAIL_RECIPIENT=${FILEDROP_EMAIL_RECIPIENT}
      - FILEDROP_SENDER_NAME=${FILEDROP_SENDER_NAME}
    depends_on:
      - DB
      - Redis
    volumes:
      - ${DOCKER_VOLUMES}/Nextcloud/data:/var/www/html
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1GB

  DB:
    container_name: DB
    image: mariadb:11.8-ubi
    restart: unless-stopped
    networks:
      - MariaDB
    environment:
      - MYSQL_DATABASE=DB
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ADMIN_PASSWORD}
    volumes:
      - ${DOCKER_VOLUMES}/Nextcloud/database:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  Redis:
    container_name: Redis
    image: redis
    restart: unless-stopped
    networks:
      - Redis
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

networks:
  Nextcloud:
    name: Nextcloud
    external: true
  Redis:
    name: Redis
    external: true
  MariaDB:
    name: MariaDB
    external: true
