name: Nextcloud
services:
  Nextcloud:
    container_name: Nextcloud
    image: nextcloud:33.0.0-apache
    restart: unless-stopped
    networks:
      - Nextcloud
      - NextcloudCache
      - NextcloudDB
    environment:
      - MYSQL_DATABASE=DB
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_HOST=NextcloudDB
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_HOST=NextcloudCache
      - NEXTCLOUD_TRUSTED_DOMAINS=${HOST}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEHOST=${HOST}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${HOST}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=noreply
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=32G
      - APACHE_DISABLE_REWRITE_IP=1
      - APACHE_BODY_LIMIT=0
    depends_on:
      - NextcloudDB
      - NextcloudCache
    volumes:
      - ${DOCKER_VOLUMES}/Nextcloud/data:/var/www/html
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1GB

  NextcloudDB:
    container_name: NextcloudDB
    image: mariadb:11.8.6-ubi9
    restart: unless-stopped
    networks:
      - NextcloudDB
    environment:
      - MYSQL_DATABASE=DB
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ADMIN_PASSWORD}
    volumes:
      - ${DOCKER_VOLUMES}/Nextcloud/database:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  NextcloudCache:
    container_name: NextcloudCache
    image: redis:8.6.1-alpine3.23@sha256:2afba59292f25f5d1af200496db41bea2c6c816b059f57ae74703a50a03a27d0
    user: "${UID}:${GID}"
    restart: unless-stopped
    command: redis-server --save ""
    networks:
      - NextcloudCache
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  Nextcloud:
    external: true
  NextcloudCache:
    external: true
  NextcloudDB:
    external: true
