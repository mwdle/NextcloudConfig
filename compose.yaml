name: Nextcloud
services:
  Nextcloud:
    container_name: Nextcloud
    image: nextcloud:33.0.1-apache@sha256:0b14848e05d19aa25e8a189eb9cfef4215489e0cbf5eb999e8784bf03027c226
    user: "${UID}:${GID}"
    restart: unless-stopped
    networks:
      - Nextcloud
      - NextcloudDB
      - NextcloudCache
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=NextcloudDB
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_HOST=NextcloudCache
      - NEXTCLOUD_TRUSTED_DOMAINS=${HOST}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEHOST=${HOST}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${HOST}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=noreply
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=32G
      - APACHE_BODY_LIMIT=0
    depends_on:
      - NextcloudDB
      - NextcloudCache
    volumes:
      - ${DOCKER_VOLUMES}/Nextcloud/data:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      # Workaround for rootless permission issues (https://help.nextcloud.com/t/nextcloud-containerized-on-synology-with-changed-uid-gid/181714/4)
      - ./overrides/redis-session.ini:/usr/local/etc/php/conf.d/redis-session.ini
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2GB

  NextcloudDB:
    container_name: NextcloudDB
    image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    user: "${UID}:${GID}"
    restart: unless-stopped
    networks:
      - NextcloudDB
    shm_size: 512M
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${DOCKER_VOLUMES}/Nextcloud/database:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1GB

  NextcloudCache:
    container_name: NextcloudCache
    image: redis:8.6.2-alpine3.23@sha256:81b6f81d6a6c5b9019231a2e8eb10085e3a139a34f833dcc965a8a959b040b72
    user: "${UID}:${GID}"
    restart: unless-stopped
    command: redis-server --save ""
    networks:
      - NextcloudCache
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  Nextcloud:
    external: true
  NextcloudCache:
    external: true
  NextcloudDB:
    external: true
